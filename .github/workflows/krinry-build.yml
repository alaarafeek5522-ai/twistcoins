name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, profile, release]
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
        type: choice
        options: [apk, appbundle, apk-split]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android .

      - name: Inject MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/alaa/twistcoins
          cat > android/app/src/main/kotlin/com/alaa/twistcoins/MainActivity.kt << 'KTEOF'
          package com.alaa.twistcoins

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import android.content.pm.PackageManager
          import android.os.Build

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "com.alaa.twistcoins/security"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "getSignature") {
                          try {
                              val sigBytes = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                  val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                                  info.signingInfo?.apkContentsSigners?.firstOrNull()?.toByteArray()
                              } else {
                                  @Suppress("DEPRECATION")
                                  val info = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                                  info.signatures?.firstOrNull()?.toByteArray()
                              }
                              if (sigBytes != null) {
                                  val md = java.security.MessageDigest.getInstance("SHA-256")
                                  val digest = md.digest(sigBytes)
                                  result.success(digest.joinToString(":") { "%02X".format(it) })
                              } else {
                                  result.error("ERROR", "No signature found", null)
                              }
                          } catch (e: Exception) {
                              result.error("ERROR", e.message, null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KTEOF

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/twistcoins.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << KEYEOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=twistcoins.jks
          KEYEOF

      - name: Build
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"
          if [ "$OUT" = "apk" ]; then
            flutter build apk --$TYPE
          elif [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE --split-per-abi
          elif [ "$OUT" = "appbundle" ]; then
            flutter build appbundle --$TYPE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
